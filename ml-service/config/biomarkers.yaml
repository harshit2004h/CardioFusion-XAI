# ============================================================
# CardioFusion-XAI
# Biomarker Configuration
# ============================================================


# ============================================================
# MODALITY
# ============================================================

modality:

  name: "biomarkers"

  enabled: true

  type: "tabular"


# ============================================================
# DATASETS
# ============================================================

datasets:

  # ----------------------------------------------------------
  # ZHEEN
  # ----------------------------------------------------------

  zheen:

    enabled: true

    name: "Zheen"

    root: "./data/raw/biomarkers/zheen"

    task: "myocardial_infarction"

    target_column: "target"


  # ----------------------------------------------------------
  # UCI HEART FAILURE
  # ----------------------------------------------------------

  uci_heart_failure:

    enabled: true

    name: "UCI Heart Failure"

    root: "./data/raw/biomarkers/uci_heart_failure"

    task: "heart_failure"

    target_column: "DEATH_EVENT"


# ============================================================
# INPUT PROCESSING
# ============================================================

preprocessing:

  enabled: true


  # ----------------------------------------------------------
  # Missing values
  # ----------------------------------------------------------

  missing_values:

    strategy: "median"

    add_missing_indicators: true


  # ----------------------------------------------------------
  # Numerical features
  # ----------------------------------------------------------

  numerical:

    enabled: true

    normalization: "standard"


  # ----------------------------------------------------------
  # Categorical features
  # ----------------------------------------------------------

  categorical:

    enabled: true

    encoding: "one_hot"

    handle_unknown: "ignore"


  # ----------------------------------------------------------
  # Outliers
  # ----------------------------------------------------------

  outliers:

    enabled: true

    method: "iqr"

    multiplier: 1.5


# ============================================================
# FEATURE ENGINEERING
# ============================================================

feature_engineering:

  enabled: true

  add_interaction_features: false

  add_missing_indicators: true


# ============================================================
# DATASET SPLIT
# ============================================================

split:

  strategy: "stratified"

  train_ratio: 0.70

  validation_ratio: 0.15

  test_ratio: 0.15

  random_seed: 42


# ============================================================
# DATALOADER
# ============================================================

dataloader:

  batch_size: 64

  num_workers: 2

  pin_memory: true

  persistent_workers: true

  shuffle_train: true


# ============================================================
# BIOMARKER MODEL
# ============================================================

model:

  name: "BiomarkerMLP"


  input_dimension: null


  hidden_dimensions:

    - 256
    - 256
    - 128


  activation: "gelu"


  dropout: 0.2


  normalization: "batchnorm"


# ============================================================
# OUTPUT PROJECTION
# ============================================================

projection:

  input_dim: 128

  output_dim: 512

  dropout: 0.1


# ============================================================
# EMBEDDING
# ============================================================

embedding:

  enabled: true

  dimension: 512

  normalize: true


# ============================================================
# CLASSIFICATION
# ============================================================

classification:

  num_classes: 2

  loss:

    name: "BCEWithLogitsLoss"

    pos_weight: "auto"


# ============================================================
# TRAINING
# ============================================================

training:

  batch_size: 64

  epochs: 100

  learning_rate: 0.0001

  weight_decay: 0.0001

  gradient_clip_norm: 1.0


# ============================================================
# IMBALANCE HANDLING
# ============================================================

class_imbalance:

  enabled: true

  method: "pos_weight"


# ============================================================
# EVALUATION
# ============================================================

evaluation:

  threshold: 0.5

  metrics:

    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "auroc"
    - "auprc"
    - "sensitivity"
    - "specificity"


# ============================================================
# CHECKPOINTS
# ============================================================

checkpoint:

  root: "./checkpoints/biomarkers"

  zheen:

    filename: "best_zheen_model.pt"

    monitor: "val_auroc"

    mode: "max"


  uci_heart_failure:

    filename: "best_uci_heart_failure_model.pt"

    monitor: "val_auroc"

    mode: "max"


# ============================================================
# XAI
# ============================================================

xai:

  enabled: true

  method: "shap"

  max_display: 20