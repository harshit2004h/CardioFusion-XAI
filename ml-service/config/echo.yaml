# ============================================================
# CardioFusion-XAI
# Echocardiography Configuration
# ============================================================


# ============================================================
# MODALITY
# ============================================================

modality:

  name: "echo"

  enabled: true

  type: "video"


# ============================================================
# DATASET
# ============================================================

dataset:

  name: "EchoNet-Dynamic"

  id: "echonet"

  root: "./data/raw/echonet"


  # ----------------------------------------------------------
  # Metadata
  # ----------------------------------------------------------

  file_list: "FileList.csv"

  volume_tracings: "VolumeTracings.csv"

  video_directory: "Videos"


# ============================================================
# VIDEO
# ============================================================

video:

  target_fps: 30

  num_frames: 32

  sampling_strategy: "uniform"

  resize:

    enabled: true

    width: 224

    height: 224


# ============================================================
# IMAGE PREPROCESSING
# ============================================================

preprocessing:

  enabled: true


  normalization:

    enabled: true

    mean:

      - 0.485
      - 0.456
      - 0.406

    std:

      - 0.229
      - 0.224
      - 0.225


  grayscale:

    enabled: true


  crop:

    enabled: false


# ============================================================
# DATA AUGMENTATION
# ============================================================

augmentation:

  enabled: true


  horizontal_flip:

    enabled: true

    probability: 0.5


  rotation:

    enabled: true

    probability: 0.2

    degrees: 10


  brightness:

    enabled: true

    probability: 0.2

    factor: 0.1


  contrast:

    enabled: true

    probability: 0.2

    factor: 0.1


# ============================================================
# DATASET SPLIT
# ============================================================

split:

  strategy: "official"

  train: true

  validation: true

  test: true


# ============================================================
# DATALOADER
# ============================================================

dataloader:

  batch_size: 8

  num_workers: 4

  pin_memory: true

  persistent_workers: true

  shuffle_train: true


# ============================================================
# FRAME ENCODER
# ============================================================

frame_encoder:

  name: "ResNet18"

  pretrained: true

  input_channels: 1

  output_dimension: 256

  freeze_backbone: false


# ============================================================
# TEMPORAL MODEL
# ============================================================

temporal_model:

  name: "Transformer"

  embedding_dim: 256

  num_heads: 8

  num_layers: 4

  feedforward_dim: 1024

  dropout: 0.1

  activation: "gelu"


# ============================================================
# TEMPORAL POSITIONAL ENCODING
# ============================================================

positional_encoding:

  enabled: true

  type: "sinusoidal"

  max_length: 32


# ============================================================
# ECHO PROJECTION
# ============================================================

projection:

  input_dim: 256

  output_dim: 512

  dropout: 0.1


# ============================================================
# EMBEDDING
# ============================================================

embedding:

  enabled: true

  dimension: 512

  normalize: true


# ============================================================
# TASK
# ============================================================

task:

  primary: "ejection_fraction_regression"

  secondary: "heart_failure_classification"


# ============================================================
# REGRESSION
# ============================================================

regression:

  enabled: true

  target: "EF"

  loss:

    name: "SmoothL1Loss"

    beta: 1.0


# ============================================================
# CLASSIFICATION
# ============================================================

classification:

  enabled: true

  target: "heart_failure"

  num_classes: 2

  loss:

    name: "BCEWithLogitsLoss"


# ============================================================
# TRAINING
# ============================================================

training:

  batch_size: 8

  epochs: 50

  learning_rate: 0.0001

  weight_decay: 0.0001

  gradient_clip_norm: 1.0


# ============================================================
# CHECKPOINT
# ============================================================

checkpoint:

  directory: "./checkpoints/echo"

  filename: "best_echo_model.pt"

  monitor: "val_auroc"

  mode: "max"