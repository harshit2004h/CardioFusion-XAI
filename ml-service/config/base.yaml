# ============================================================
# CardioFusion-XAI
# Base ML Configuration
# ============================================================

project:
  name: "cardiofusion-xai"
  version: "0.1.0"
  environment: "development"

  description: "Multimodal cardiovascular AI and explainable machine learning system"


# ============================================================
# REPRODUCIBILITY
# ============================================================

reproducibility:
  seed: 42

  deterministic: false

  benchmark: true


# ============================================================
# DEVICE
# ============================================================

device:
  # Options:
  #   auto
  #   cuda
  #   cpu

  type: "auto"

  cuda:
    enabled: true

    device_id: 0

    allow_tf32: true

    benchmark: true

  cpu:
    enabled: true


# ============================================================
# DATA DIRECTORIES
# ============================================================

data:
  root: "./data"

  raw: "./data/raw"

  interim: "./data/interim"

  processed: "./data/processed"

  metadata: "./data/metadata"


# ============================================================
# DATASET DIRECTORIES
# ============================================================

datasets:

  ptbxl:
    root: "./data/raw/ptbxl"

  echonet:
    root: "./data/raw/echonet"

  zheen:
    root: "./data/raw/biomarkers/zheen"

  uci_heart_failure:
    root: "./data/raw/biomarkers/uci_heart_failure"

  imagecas:
    root: "./data/raw/imagecas"


# ============================================================
# MODEL CHECKPOINTS
# ============================================================

checkpoints:
  root: "./checkpoints"

  ecg: "./checkpoints/ecg"

  echo: "./checkpoints/echo"

  biomarkers: "./checkpoints/biomarkers"

  ccta: "./checkpoints/ccta"

  fusion: "./checkpoints/fusion"


# ============================================================
# OUTPUT DIRECTORIES
# ============================================================

outputs:
  root: "./outputs"

  logs: "./outputs/logs"

  predictions: "./outputs/predictions"

  metrics: "./outputs/metrics"

  figures: "./outputs/figures"

  embeddings: "./outputs/embeddings"

  reports: "./outputs/reports"


# ============================================================
# GENERAL TRAINING
# ============================================================

training:

  batch_size: 32

  epochs: 50

  learning_rate: 0.0001

  weight_decay: 0.0001

  gradient_clip_norm: 1.0

  accumulation_steps: 1

  shuffle: true


# ============================================================
# OPTIMIZER
# ============================================================

optimizer:

  name: "AdamW"

  betas:
    - 0.9
    - 0.999

  eps: 0.00000001


# ============================================================
# LEARNING RATE SCHEDULER
# ============================================================

scheduler:

  name: "ReduceLROnPlateau"

  mode: "max"

  factor: 0.5

  patience: 3

  min_lr: 0.000001


# ============================================================
# MIXED PRECISION
# ============================================================

mixed_precision:

  enabled: true

  dtype: "float16"


# ============================================================
# DATA LOADING
# ============================================================

dataloader:

  num_workers: 4

  pin_memory: true

  persistent_workers: true

  prefetch_factor: 2


# ============================================================
# EARLY STOPPING
# ============================================================

early_stopping:

  enabled: true

  patience: 10

  monitor: "val_auroc"

  mode: "max"

  min_delta: 0.0001


# ============================================================
# CHECKPOINTING
# ============================================================

checkpointing:

  enabled: true

  save_best: true

  save_last: true

  monitor: "val_auroc"

  mode: "max"

  save_optimizer: true

  save_scheduler: true


# ============================================================
# EXPERIMENT TRACKING
# ============================================================

wandb:

  enabled: true

  project: "cardiofusion-xai"

  entity: null

  group: "development"

  job_type: "training"

  log_model: true

  log_system_metrics: true


# ============================================================
# EXPERIMENTS
# ============================================================

experiments:

  root: "./experiments"

  save_config: true

  save_metrics: true

  save_predictions: true


# ============================================================
# MULTIMODAL FUSION
# ============================================================

fusion:

  enabled: true

  embedding_dim: 512

  modalities:
    - "ecg"
    - "echo"
    - "biomarkers"

  use_modality_mask: true

  use_quality_weighting: true

  use_attention: true

  attention:

    num_heads: 8

    dropout: 0.1

    num_layers: 2


# ============================================================
# MODALITY AVAILABILITY
# ============================================================

modalities:

  ecg:
    enabled: true

  echo:
    enabled: true

  biomarkers:
    enabled: true

  ccta:
    enabled: false


# ============================================================
# XAI
# ============================================================

xai:

  enabled: true

  methods:

    ecg:
      - "integrated_gradients"
      - "saliency"

    echo:
      - "integrated_gradients"

    biomarkers:
      - "shap"

    fusion:
      - "attention"


# ============================================================
# EVALUATION
# ============================================================

evaluation:

  metrics:

    classification:
      - "accuracy"
      - "precision"
      - "recall"
      - "f1"
      - "auroc"
      - "auprc"
      - "sensitivity"
      - "specificity"

  save_predictions: true

  save_confusion_matrix: true

  save_roc_curve: true

  save_pr_curve: true


# ============================================================
# LOGGING
# ============================================================

logging:

  level: "INFO"

  console: true

  file: true

  file_path: "./outputs/logs/ml-service.log"


# ============================================================
# DEVELOPMENT
# ============================================================

development:

  debug: true

  verbose: true

  profile: false