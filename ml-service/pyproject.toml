[build-system]
requires = [
    "setuptools>=69",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "cardiofusion-xai-ml"
version = "0.1.0"

description = "Multimodal cardiovascular AI and explainable machine learning service for CardioFusion-XAI"

readme = "README.md"

requires-python = ">=3.12,<3.13"

license = { text = "Research and Educational Use" }

authors = [
    { name = "CardioFusion-XAI Team" }
]

keywords = [
    "cardiovascular",
    "machine-learning",
    "deep-learning",
    "pytorch",
    "ecg",
    "echocardiography",
    "biomarkers",
    "multimodal-ai",
    "explainable-ai"
]


# ------------------------------------------------------------
# Runtime dependencies
#
# PyTorch is intentionally NOT listed here.
#
# PyTorch is installed separately using the CUDA-specific
# PyTorch wheel required by the NVIDIA GPU environment.
# ------------------------------------------------------------

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",

    "PyWavelets>=1.6,<2",
    "wfdb>=4.2,<5",

    "opencv-python>=4.10,<5",
    "Pillow>=10.4,<12",

    "pydicom>=3.0,<4",
    "nibabel>=5.3,<6",

    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",

    "tqdm>=4.66,<5",

    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",

    "shap>=0.46,<1",

    "wandb>=0.19,<1",
    "modal>=1.0,<2"
]


# ------------------------------------------------------------
# Development dependencies
# ------------------------------------------------------------

[project.optional-dependencies]

dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "black>=24.10,<27"
]


# ------------------------------------------------------------
# Setuptools configuration
#
# Our Python source code lives inside:
#
# src/
#
# Example:
#
# src/
# ├── datasets/
# ├── models/
# ├── preprocessing/
# ├── training/
# └── utils/
# ------------------------------------------------------------

[tool.setuptools]

package-dir = { "" = "src" }


[tool.setuptools.packages.find]

where = [
    "src"
]


# ------------------------------------------------------------
# Pytest
# ------------------------------------------------------------

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

python_classes = [
    "Test*"
]

python_functions = [
    "test_*"
]

addopts = [
    "-ra"
]


# ------------------------------------------------------------
# Ruff
# ------------------------------------------------------------

[tool.ruff]

line-length = 100

target-version = "py312"


[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]


# ------------------------------------------------------------
# Black
# ------------------------------------------------------------

[tool.black]

line-length = 100

target-version = [
    "py312"
]